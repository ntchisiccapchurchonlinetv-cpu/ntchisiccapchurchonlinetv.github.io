<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Facebook Live - NTCHISI CCAP ONLINE TV</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: #075e54;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: 25px auto;
        }

        .top {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .top a {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #075e54;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #075e54;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete {
            background: #c62828;
        }

        .preview {
            margin-top: 25px;
            display: none;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>📘 Manage Facebook Live</h1>
    <p>NTCHISI CCAP ONLINE TV</p>
</header>

<div class="container">

    <div class="top">
        <a href="dashboard.html">← Dashboard</a>
        <a href="tv.html">📺 View TV</a>
    </div>

    <div class="box">

        <h2>🔴 Facebook Live</h2>

        <p>
            Paste the public Facebook Live video URL below.
        </p>

        <label>
            Facebook Live URL
        </label>

        <input
            type="url"
            id="facebookUrl"
            placeholder="https://www.facebook.com/..."
        >

        <button id="saveButton">
            💾 Save Live Video
        </button>

        <button
            id="deleteButton"
            class="delete">
            🗑️ Remove Live Video
        </button>

        <p id="message"></p>

        <div
            class="preview"
            id="previewBox">

            <iframe
                id="previewFrame"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    deleteDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAXr0D8iffLsa1FuwF4Xjw8i3KlKqvZsVc",

    authDomain:
    "ntchisi-ccap-church-online-tv.firebaseapp.com",

    projectId:
    "ntchisi-ccap-church-online-tv",

    storageBucket:
    "ntchisi-ccap-church-online-tv.firebasestorage.app",

    messagingSenderId:
    "432495723011",

    appId:
    "1:432495723011:web:9ad91aa93e2f44a8e28436",

    measurementId:
    "G-69WSZSCK2P"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const facebookUrl =
    document.getElementById("facebookUrl");

const saveButton =
    document.getElementById("saveButton");

const deleteButton =
    document.getElementById("deleteButton");

const message =
    document.getElementById("message");

const previewBox =
    document.getElementById("previewBox");

const previewFrame =
    document.getElementById("previewFrame");


const tvRef =
    doc(db, "settings", "tv");


function createFacebookEmbed(url) {

    return "https://www.facebook.com/plugins/video.php?href="
        + encodeURIComponent(url)
        + "&show_text=false&width=800";

}


function showPreview(url) {

    if (!url) {

        previewBox.style.display = "none";

        previewFrame.src = "";

        return;
    }

    previewFrame.src =
        createFacebookEmbed(url);

    previewBox.style.display =
        "block";
}


onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href =
            "admin.html";

        return;
    }

    try {

        const snapshot =
            await getDoc(tvRef);

        if (snapshot.exists()) {

            const data =
                snapshot.data();

            facebookUrl.value =
                data.facebookUrl || "";

            showPreview(
                data.facebookUrl || ""
            );

        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ Failed to load TV.";

        message.style.color =
            "red";
    }

});


facebookUrl.addEventListener(
    "input",
    () => {

        showPreview(
            facebookUrl.value.trim()
        );

    }
);


saveButton.addEventListener(
    "click",
    async () => {

        const url =
            facebookUrl.value.trim();

        if (!url) {

            message.textContent =
                "❌ Paste a Facebook Live URL.";

            message.style.color =
                "red";

            return;
        }

        saveButton.disabled = true;

        message.textContent =
            "Saving...";

        message.style.color =
            "#075e54";

        try {

            await setDoc(
                tvRef,
                {
                    facebookUrl: url,
                    updatedAt: new Date()
                }
            );

            message.textContent =
                "✅ Facebook Live saved!";

            message.style.color =
                "green";

        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ Failed to save.";

            message.style.color =
                "red";

        }

        saveButton.disabled = false;

    }
);


deleteButton.addEventListener(
    "click",
    async () => {

        const confirmed =
            confirm(
                "Remove the Facebook Live video?"
            );

        if (!confirmed) return;

        try {

            await deleteDoc(tvRef);

            facebookUrl.value = "";

            showPreview("");

            message.textContent =
                "✅ Live video removed.";

            message.style.color =
                "green";

        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ Failed to remove video.";

            message.style.color =
                "red";

        }

    }
);

</script>

</body>
</html>
