<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live TV - NTCHISI CCAP ONLINE TV</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #075e54;
            text-align: center;
            padding: 20px 15px;
        }

        header h1 {
            margin: 0;
        }

        .live {
            display: inline-block;
            background: #c62828;
            padding: 7px 14px;
            border-radius: 20px;
            margin-top: 10px;
            font-weight: bold;
        }

        .player {
            width: 94%;
            max-width: 900px;
            margin: 25px auto;
            background: #000;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }

        .offline {
            text-align: center;
            padding: 50px 20px;
        }

        .offline h2 {
            margin-bottom: 10px;
        }

        .content {
            text-align: center;
            padding: 20px;
        }

        .home {
            display: inline-block;
            background: #075e54;
            color: white;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 15px;
        }

        footer {
            background: #033f3a;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>

    <h1>📺 NTCHISI CCAP ONLINE TV</h1>

    <div class="live">
        🔴 LIVE TV
    </div>

</header>


<div class="player" id="player">

    <div class="offline" id="offline">

        <h2>📺 No Live Video Available</h2>

        <p>
            There is currently no live broadcast.
        </p>

    </div>

    <iframe
        id="facebookPlayer"
        allowfullscreen
        scrolling="no"
        frameborder="0"
        style="display:none;">
    </iframe>

</div>


<div class="content">

    <h2>
        Welcome to NTCHISI CCAP Online TV
    </h2>

    <p>
        Watch church programs, worship,
        music and community events.
    </p>

    <a
        href="index.html"
        class="home">

        🏠 Back to Home

    </a>

</div>


<footer>

    <p>
        © 2026 NTCHISI CCAP ONLINE TV
    </p>

    <p>
        Faith • News • Music • Community
    </p>

</footer>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAXr0D8iffLsa1FuwF4Xjw8i3KlKqvZsVc",

    authDomain:
    "ntchisi-ccap-church-online-tv.firebaseapp.com",

    projectId:
    "ntchisi-ccap-church-online-tv",

    storageBucket:
    "ntchisi-ccap-church-online-tv.firebasestorage.app",

    messagingSenderId:
    "432495723011",

    appId:
    "1:432495723011:web:9ad91aa93e2f44a8e28436",

    measurementId:
    "G-69WSZSCK2P"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


const tvRef =
    doc(db, "settings", "tv");


const player =
    document.getElementById("facebookPlayer");

const offline =
    document.getElementById("offline");


function createFacebookEmbed(url) {

    return "https://www.facebook.com/plugins/video.php?href="
        + encodeURIComponent(url)
        + "&show_text=false&width=900";

}


async function loadLiveTV() {

    try {

        const snapshot =
            await getDoc(tvRef);


        if (!snapshot.exists()) {

            showOffline();

            return;

        }


        const data =
            snapshot.data();


        const url =
            data.facebookUrl || "";


        if (!url) {

            showOffline();

            return;

        }


        player.src =
            createFacebookEmbed(url);

        player.style.display =
            "block";

        offline.style.display =
            "none";


    } catch (error) {

        console.error(error);

        showOffline();

    }

}


function showOffline() {

    player.src = "";

    player.style.display =
        "none";

    offline.style.display =
        "block";

}


loadLiveTV();

</script>

</body>
</html>
