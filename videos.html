<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Videos - NTCHISI CCAP ONLINE TV</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

header {
    background: #075e54;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
}

.container {
    width: 92%;
    max-width: 850px;
    margin: 25px auto;
}

.video-card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.video-card img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 15px;
}

.video-card h2 {
    color: #075e54;
    margin-top: 0;
}

.description {
    line-height: 1.6;
    color: #555;
}

video {
    width: 100%;
    max-height: 500px;
    background: #000;
    border-radius: 10px;
    margin-top: 15px;
}

.no-video {
    background: #eeeeee;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    margin-top: 15px;
}

#status {
    text-align: center;
    font-weight: bold;
    margin: 25px 0;
}

.back {
    display: inline-block;
    background: #075e54;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
    margin-bottom: 20px;
}

</style>

</head>


<body>


<header>

<h1>🎥 NTCHISI CCAP ONLINE TV</h1>

<p>Recorded Videos</p>

</header>


<div class="container">

<a class="back" href="index.html">
← Back to Home
</a>


<p id="status">
Loading videos...
</p>


<div id="videoList"></div>


</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAXr0D8iffLsa1FuwF4Xjw8i3KlKqvZsVc",

    authDomain:
    "ntchisi-ccap-church-online-tv.firebaseapp.com",

    projectId:
    "ntchisi-ccap-church-online-tv",

    storageBucket:
    "ntchisi-ccap-church-online-tv.firebasestorage.app",

    messagingSenderId:
    "432495723011",

    appId:
    "1:432495723011:web:9ad91aa93e2f44a8e28436",

    measurementId:
    "G-69WSZSCK2P"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


const videoList =
document.getElementById("videoList");

const status =
document.getElementById("status");


async function loadVideos() {

    try {

        const snapshot =
        await getDocs(
            collection(db, "videos")
        );


        videoList.innerHTML = "";


        if (snapshot.empty) {

            status.textContent =
            "🎥 No recorded videos available yet.";

            return;

        }


        status.textContent = "";


        snapshot.forEach((videoDoc) => {

            const video =
            videoDoc.data();


            const card =
            document.createElement("div");

            card.className =
            "video-card";


            /* THUMBNAIL */

            if (video.thumbnailUrl) {

                const image =
                document.createElement("img");

                image.src =
                video.thumbnailUrl;

                image.alt =
                video.title ||
                "Video";

                image.onerror =
                function() {

                    this.style.display =
                    "none";

                };

                card.appendChild(image);

            }


            /* TITLE */

            const title =
            document.createElement("h2");

            title.textContent =
            video.title ||
            "Untitled Video";

            card.appendChild(title);


            /* DESCRIPTION */

            if (video.description) {

                const description =
                document.createElement("p");

                description.className =
                "description";

                description.textContent =
                video.description;

                card.appendChild(description);

            }


            /* VIDEO PLAYER */

            if (video.videoUrl) {

                const player =
                document.createElement("video");

                player.controls =
                true;

                player.preload =
                "metadata";

                player.playsInline =
                true;

                player.src =
                video.videoUrl;

                player.setAttribute(
                    "controlsList",
                    "nodownload"
                );

                card.appendChild(player);

            } else {

                const noVideo =
                document.createElement("div");

                noVideo.className =
                "no-video";

                noVideo.textContent =
                "⚠️ Video is not available.";

                card.appendChild(noVideo);

            }


            videoList.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        status.textContent =
        "❌ Failed to load videos.";

        status.style.color =
        "red";

    }

}


loadVideos();

</script>


</body>

</html>
