<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>News - NTCHISI CCAP ONLINE TV</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #075e54;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: 25px auto;
        }

        .news-card {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.12);
        }

        .news-card img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .news-card h2 {
            color: #075e54;
            margin-top: 0;
        }

        .date {
            color: #777;
            font-size: 14px;
        }

        .content {
            line-height: 1.7;
        }

        .read-more {
            display: inline-block;
            background: #075e54;
            color: white;
            padding: 11px 17px;
            text-decoration: none;
            border-radius: 7px;
            margin-top: 10px;
            font-weight: bold;
        }

        #status {
            text-align: center;
            font-weight: bold;
            margin: 25px 0;
        }

        .back {
            display: inline-block;
            background: #075e54;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 7px;
            margin-top: 5px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <h1>
        📰 NTCHISI CCAP ONLINE TV
    </h1>

    <p>
        Latest News
    </p>

</header>


<div class="container">


    <p id="status">
        Loading news...
    </p>


    <div id="newsList"></div>


    <a
        class="back"
        href="index.html">

        ← Back to Home

    </a>


</div>


<script type="module">


    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
        "AIzaSyAXr0D8iffLsa1FuwF4Xjw8i3KlKqvZsVc",

        authDomain:
        "ntchisi-ccap-church-online-tv.firebaseapp.com",

        projectId:
        "ntchisi-ccap-church-online-tv",

        storageBucket:
        "ntchisi-ccap-church-online-tv.firebasestorage.app",

        messagingSenderId:
        "432495723011",

        appId:
        "1:432495723011:web:9ad91aa93e2f44a8e28436",

        measurementId:
        "G-69WSZSCK2P"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    const newsList =
        document.getElementById(
            "newsList"
        );


    const status =
        document.getElementById(
            "status"
        );


    async function loadNews() {


        try {


            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "news"
                    )
                );


            newsList.innerHTML =
                "";


            if (snapshot.empty) {


                status.textContent =
                    "📰 No news available yet.";


                return;

            }


            status.textContent =
                "";


            snapshot.forEach(
                (newsDoc) => {


                    const news =
                        newsDoc.data();


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "news-card";


                    // IMAGE

                    if (
                        news.imageUrl
                    ) {


                        const image =
                            document.createElement(
                                "img"
                            );


                        image.src =
                            news.imageUrl;


                        image.alt =
                            news.title ||
                            "News";


                        image.onerror =
                            function() {

                                this.style.display =
                                    "none";

                            };


                        card.appendChild(
                            image
                        );

                    }


                    // TITLE

                    const title =
                        document.createElement(
                            "h2"
                        );


                    title.textContent =
                        news.title ||
                        "Untitled News";


                    card.appendChild(
                        title
                    );


                    // DATE

                    const date =
                        document.createElement(
                            "p"
                        );


                    date.className =
                        "date";


                    if (
                        news.createdAt &&
                        news.createdAt.toDate
                    ) {


                        date.textContent =
                            news.createdAt
                                .toDate()
                                .toLocaleDateString(
                                    "en-GB"
                                );

                    } else {


                        date.textContent =
                            "Recently published";

                    }


                    card.appendChild(
                        date
                    );


                    // CONTENT

                    const content =
                        document.createElement(
                            "p"
                        );


                    content.className =
                        "content";


                    content.textContent =
                        news.content ||
                        news.description ||
                        "";


                    card.appendChild(
                        content
                    );


                    // READ MORE

                    const readMore =
                        document.createElement(
                            "a"
                        );


                    readMore.className =
                        "read-more";


                    readMore.textContent =
                        "Read More →";


                    readMore.href =
                        "edit-news.html?id=" +
                        newsDoc.id;


                    card.appendChild(
                        readMore
                    );


                    newsList.appendChild(
                        card
                    );


                }
            );


        } catch (error) {


            console.error(
                error
            );


            status.textContent =
                "❌ Failed to load news.";


            status.style.color =
                "red";


        }

    }


    loadNews();


</script>


</body>

</html>
